# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: abzu
description: An elegant, powerful operating system for desktops, workstations and homelabs that honours and preserves the ancient traditions.

base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  # Enable RPM Fusion and Sniffnet before the dnf module for codecs and b43-firmware.
  - type: script
    scripts:
      - enable-rpmfusion.sh
      - install-sniffnet.sh

  # Enable COPR repositories dynamically so the chroot always matches the
  # Fedora version of the build container. %OS_VERSION% is not expanded
  # inside the dnf module's COPR "chroot" field, so we avoid hardcoding.
  - type: script
    scripts:
      - enable-copr.sh

  - type: dnf
    install:
      packages:
        # --- Core build toolchain (needed for Gershwin/GNUstep source builds) ---
        - git
        - wget
        - gcc
        - gcc-c++
        - gcc-objc
        - clang
        - llvm
        - lld
        - make
        - cmake
        - ninja-build
        - meson
        - pkgconf-pkg-config
        - redhat-rpm-config
        - curl
        - jq
        - sudo
        - unzip
        - zip
        - p7zip
        - xz
        - file

        # --- GNUstep build prerequisites ---
        # NOTE: libobjc2, gnustep-make, libdispatch, libs-base (Foundation),
        # libs-gui (AppKit) and libs-back are ALL built from source by
        # setup-gnustep.sh using a single Clang + libobjc2 toolchain.
        #
        # We intentionally do NOT install gnustep-base / gnustep-base-devel
        # from Fedora: their headers (specifically
        # /usr/include/Foundation/NSBackgroundActivityScheduler.h) contain
        # an illegal '__block' on an Objective-C instance variable that
        # modern Clang rejects as a hard error.
        #
        # libobjc2 / libobjc2-devel / gnustep-make are kept as a system-wide
        # fallback (gnustep-config in /usr/bin), and were shown to coexist
        # cleanly with our source build in prior builds -- our
        # /usr/local/System/Tools/gnustep-config takes PATH precedence.
        - libobjc2
        - libobjc2-devel
        - gnustep-make

        # --- Aspell (required for GSspell.service) ---
        - aspell
        - aspell-devel

        # --- WindowMaker (the GNUstep window manager) ---
        - WindowMaker
        - WindowMaker-extra
        - WINGs-libs
        - WINGs-devel

        # --- X11 / graphics development headers for GNUstep & Gershwin ---
        - libX11-devel
        - libXext-devel
        - libXpm-devel
        - libXft-devel
        - libXinerama-devel
        - libXrandr-devel
        - libXcursor-devel
        - libXt-devel
        - libXmu-devel
        - libpng-devel
        - libjpeg-turbo-devel
        - libtiff-devel
        - freetype-devel
        - fontconfig-devel
        - harfbuzz-devel
        - fribidi-devel
        - librsvg2-devel
        - cairo-devel
        - libart_lgpl-devel

        # --- GNUstep/Gershwin build dependencies ---
        - libxml2-devel
        - libxslt-devel
        - openssl-devel
        - gnutls-devel
        - libffi-devel
        - libicu-devel
        - libcurl-devel
        - zlib-devel            # libs-base: NSData compression
        - avahi-devel           # libs-base: NSNetService / Bonjour
        - libarchive-devel
        - libdispatch-devel     # provides dispatch.pc fallback; source build shadows it
        - libnotify-devel
        - dbus-devel
        - alsa-lib-devel

        # --- Display manager (LightDM; WDM is too old for modern Fedora) ---
        - lightdm
        - lightdm-gtk-greeter

        # --- Session / desktop utilities ---
        - xorg-x11-xinit
        - xorg-x11-server-Xorg
        - xterm
        - desktop-file-utils
        - shared-mime-info
        - hicolor-icon-theme

        # --- Optional GTK compatibility for flatpaks / GTK apps ---
        - gtk3
        - gtk-update-icon-cache
        - gtk-murrine-engine
        - gtk2-engines

        # --- Retained Abzu-specific / utility packages ---
        - gdouros-akkadian-fonts
        - micro
        - starship
        - gamemode
        - mangohud
        - scx-scheds
        - scx-tools
        - cockpit
        - cockpit-podman
        - usbguard
        - usbguard-notifier
        - policycoreutils-python-utils
        - wine
        - winetricks
        - yagf
        - ibus
        - ibus-table
        - R
        - gsl-devel
        - gmp-devel
        - libsass-devel
        - v8-devel
        - b43-firmware

        # --- rEFInd boot manager (split subpackages) ---
        - mactel-boot
        - rEFInd-tools
        - rEFInd-unsigned-ia32
        - rEFInd-unsigned-x64

        - wmCalClock
        - wmweather+
        - feh

        # --- Image / asset tooling retained from original theming pipeline ---
        - ImageMagick
        - sassc
        - inkscape
        - optipng

        # --- Dependencies for helper scripts ---
        - fuse3-devel   # Required by install-apple2pi.sh
        - pipx          # Required by install-beets.sh
        - rust          # Provides cargo, required by install-snow.sh
        - nodejs        # Required by install-hotline.sh
        - npm           # Required by install-hotline.sh

        # --- Lemonade local LLM server (provides lemond.service) ---
        - lemonade

  - type: kargs
    kargs:
      - preempt=full
      - mitigations=auto
      - threadirqs
      - init_on_alloc=1
      - hash_pointers=always
      - page_alloc.shuffle=1
      - randomize_kstack_offset=on
      - iommu=force
      - intel_iommu=on
      - iommu.passthrough=0
      - iommu.strict=1
      - lockdown=confidentiality
      - module.sig_enforce=1
      #Any future AKMODS support will need to be signed
      - l1d_flush=on
      - l1tf=full,force
      - spec_store_bypass_disable=on
      - spectre_v2=on
      - ssbd=force-on
      # Optional runtime Hardening
      #   sudo rpm-ostree kargs --append=slab_debug=FZ
      #   sudo systemctl reboot
      # slab_debug=FZ already implies slab_nomerge; add slab_nomerge alone only
      # if you want cache isolation without the sanity-check overhead.
      - random.trust_bootloader=off
      - random.trust_cpu=off

  - type: files
    files:
      - source: system/etc
        destination: /etc
      - source: system/var
        destination: /var
        exclude:
          - ./usrlocal
          - ./usrlocal/*
      - source: system/var/usrlocal
        destination: /usr/local
        toggle-ownership: false
        #Done to avoid permissions issues on/usr/local tree
      - source: system/usr/share
        destination: /usr/share
      - source: system/usr/local/bin
        destination: /usr/local/bin
      - source: etc/skel
        destination: /etc/skel
      # Mac WiFi driver packages
      - source: mac-wifi-pkgs
        destination: /usr/local/share/mac-wifi-pkgs

  - type: systemd
    system:
      enabled:
        - scx_loader.service
        - usbguard.service
        - cockpit.socket
        - lightdm.service
        - lemond.service
        # First-boot rEFInd installation. Unit file lives at
        # files/system/etc/systemd/system/abzu-install-refind.service
        # and is placed at /etc/systemd/system/ by the files module above.
        # The script self-gates on /var/lib/abzu/refind-installed and on
        # /sys/firmware/efi, so this is a no-op on non-EFI systems and on
        # every boot after the first successful run.
        - abzu-install-refind.service

  - type: script
    scripts:
      # Build & install the full GNUstep stack from source with a single
      # Clang + libobjc2 toolchain:
      #   libobjc2 -> libdispatch -> gnustep-make -> libs-base (Foundation)
      #   -> libs-gui (AppKit + Tools/GSspell) -> libs-back (x11/cairo)
      # then Gershwin (Eau theme, Menu.app) and GSDock via copy-assets.sh.
      # Fedora 45 does not package gnustep-gui/back, and its gnustep-base
      # headers are incompatible with modern Clang, so nothing from the
      # GNUstep stack is installed via dnf.
      - setup-gnustep.sh
      - copy-assets.sh

      # Retained non-GNOME installers
      - install-intel-sde.sh
      - install-apple2pi.sh
      - install-tether.sh
      - install-hotline.sh
      - install-snow.sh
      - install-fono.sh
      - install-icloud-linux.sh
      - install-cunai.sh
      - configure-chrony-nts.sh
      - install-beets.sh
      - install-zaparoo.sh
      - configure-stellarium.sh
      - install-sumer-r-package.sh
      - cuneiform-toggle.sh
      - enable-vaapi.sh
      - install-quiver.sh

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          # Browsers
          - net.waterfox.waterfox
          - org.torproject.torbrowser-launcher
          - com.visualstudio.code
          # Communication
          - com.discordapp.Discord
          # Media
          - org.strawberrymusicplayer.strawberry
          - org.audacityteam.Audacity
          - dk.gqrx.gqrx
          - org.lyx.LyX
          # Creativity and science
          - org.kde.krita
          - org.kde.haruna
          - org.stellarium.Stellarium
          # Productivity
          - io.github.diegopvlk.Dosage
          - org.gnuhealth.mygnuhealth
          - app.gmtp.gMTP
          - as.may.moat
          - io.github.heidefinnischen.cuneo
          # Utilities
          - io.github.kolunmi.Bazaar
          - app.twintaillauncher.ttl
          - org.freedownloadmanager.Manager
          - com.github.tchx84.Flatseal
          - com.github.zocker_160.SyncThingy
          - org.localsend.localsend_app
          # Gaming
          - com.valvesoftware.Steam
          - com.valvesoftware.Steam.CompatibilityTool.Proton
          - com.valvesoftware.Steam.Utility.steamtinkerlaunch
          - com.steamgriddb.SGDBoop
          - com.vysp3r.ProtonPlus
          - com.github.Matoking.protontricks
          - org.openmw.OpenMW
          - com.infochunk.OpenMadoola
          - io.jor.nanosaur
          - io.jor.nanosaur2
          - io.github.hedge_dev.hedgemodmanager
          - com.epicgames.ut99
          - com.epicgames.ut2004
          - com.heroicgameslauncher.hgl
          - net.lutris.Lutris
          # Streaming
          - com.obsproject.Studio
          - com.chatterino.chatterino
          # Vulkan layers
          - org.freedesktop.Platform.VulkanLayer.MangoHud
          - org.freedesktop.Platform.VulkanLayer.gamescope
          # Runtime
          - org.freedesktop.Platform
      - scope: user

  - type: initramfs
  - type: signing
