# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: abzu
description: An elegant, powerful operating system for desktops, workstations and homelabs that honours and preserves the ancient traditions.

base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  # Enable RPM Fusion before the dnf module for codecs and b43-firmware.
  - type: script
    scripts:
      - enable-rpmfusion.sh

  - type: dnf
    repos:
      copr:
        - name: bieszczaders/kernel-cachyos-addons
          chroot: fedora-44-x86_64
        - name: atim/starship
          chroot: fedora-44-x86_64
    install:
      packages:
        # --- Core build toolchain (needed for Gershwin/GNUstep source builds) ---
        - git
        - wget
        - gcc
        - gcc-c++
        - gcc-objc
        - clang
        - llvm
        - make
        - cmake
        - ninja-build
        - meson
        - pkgconf-pkg-config
        - redhat-rpm-config
        - curl
        - jq
        - sudo
        - unzip
        - zip
        - p7zip
        - xz
        - file

        # --- GNUstep runtime & libraries ---
        - libobjc2
        - libobjc2-devel
        - gnustep-make
        - gnustep-base
        - gnustep-base-devel
        - gnustep-gui
        - gnustep-gui-devel
        - gnustep-back
        - gnustep-back-devel

        # --- WindowMaker (the GNUstep window manager) ---
        - WindowMaker
        - WindowMaker-extra
        - WINGs-libs
        - WINGs-devel

        # --- X11 / graphics development headers for GNUstep & Gershwin ---
        - libX11-devel
        - libXext-devel
        - libXpm-devel
        - libXft-devel
        - libXinerama-devel
        - libXrandr-devel
        - libXcursor-devel
        - libpng-devel
        - libjpeg-turbo-devel
        - libtiff-devel
        - freetype-devel
        - fontconfig-devel
        - harfbuzz-devel
        - fribidi-devel
        - librsvg2-devel

        # --- GNUstep/Gershwin build dependencies ---
        - libxml2-devel
        - libxslt-devel
        - openssl-devel
        - gnutls-devel
        - libffi-devel
        - libicu-devel
        - libcurl-devel
        - libarchive-devel
        - libdispatch-devel
        - libgnome-desktop3-devel
        - libnotify-devel
        - dbus-devel
        - alsa-lib-devel

        # --- Display manager (LightDM; WDM is too old for modern Fedora) ---
        - lightdm
        - lightdm-gtk-greeter

        # --- Session / desktop utilities ---
        - xorg-x11-xinit
        - xorg-x11-server-Xorg
        - xterm
        - desktop-file-utils
        - shared-mime-info
        - hicolor-icon-theme
        - adwaita-icon-theme

        # --- Optional GTK compatibility for flatpaks / GTK apps ---
        - gtk3
        - gtk-update-icon-cache
        - gtk-murrine-engine
        - gtk2-engines

        # --- Retained Abzu-specific / utility packages ---
        - gdouros-akkadian-fonts
        - micro
        - starship
        - gamemode
        - mangohud
        - scx-scheds
        - scx-tools
        - cockpit
        - cockpit-podman
        - usbguard
        - usbguard-notifier
        - policycoreutils-python-utils
        - wine
        - winetricks
        - yagf
        - ibus
        - ibus-table
        - R
        - gsl-devel
        - gmp-devel
        - libsass-devel
        - v8-devel
        - b43-firmware
        - mactel-boot
        - rEFInd

        # --- Image / asset tooling retained from original theming pipeline ---
        - ImageMagick
        - sassc
        - inkscape
        - optipng

  - type: kargs
    kargs:
      - preempt=full
      - mitigations=auto
      - threadirqs
      - init_on_alloc=1
      - init_on_free=1
      - hash_pointers=always
      - page_alloc.shuffle=1
      - randomize_kstack_offset=on
      - iommu=force
      - intel_iommu=on
      - iommu.passthrough=0
      - iommu.strict=1
      - lockdown=confidentiality
      - module.sig_enforce=1
      - l1d_flush=on
      - l1tf=full,force
      - spec_store_bypass_disable=on
      - spectre_v2=on
      - ssbd=force-on
      - slab_debug=FZ
      - slab_nomerge
      - random.trust_bootloader=off
      - random.trust_cpu=off

  - type: files
    files:
      - source: system/etc
        destination: /etc
      - source: system/var
        destination: /var
        exclude:
          - ./usrlocal
          - ./usrlocal/*
      - source: system/var/usrlocal
        destination: /usr/local
        toggle-ownership: false
      - source: system/usr/share
        destination: /usr/share
      - source: system/usr/local/bin
        destination: /usr/local/bin
      - source: etc/skel
        destination: /etc/skel
      - source: mac-wifi-pkgs
        destination: /usr/local/share/mac-wifi-pkgs

      # GNUstep / WindowMaker session definition
      - source: system/usr/share/xsessions
        destination: /usr/share/xsessions

      # Retain Abzu hicolor icons (theme-agnostic)
      - source: system/usr/share/icons/hicolor
        destination: /usr/share/icons/hicolor

      # Retain Plymouth boot theme (desktop-independent)
      - source: system/usr/share/plymouth
        destination: /usr/share/plymouth

      # Retain Abzu-specific pixmaps used by branding / GDM replacement
      - source: system/usr/share/pixmaps
        destination: /usr/share/pixmaps

  - type: systemd
    system:
      enabled:
        - scx_loader.service
        - usbguard.service
        - cockpit.socket
        - lightdm.service

  - type: script
    scripts:
      # Build & install Gershwin (Eau theme, Menu.app) and GSDock
      - setup-gnustep.sh

      # Retained non-GNOME installers
      - install-intel-sde.sh
      - install-apple2pi.sh
      - install-tether.sh
      - install-hotline.sh
      - install-snow.sh
      - install-fono.sh
      - install-icloud-linux.sh
      - install-cunai.sh
      - configure-chrony-nts.sh
      - install-beets.sh
      - install-zaparoo.sh
      - configure-stellarium.sh
      - install-sumer-r-package.sh
      - cuneiform-toggle.sh
      - enable-vaapi.sh
      - install-quiver.sh

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          # Browsers
          - net.waterfox.waterfox
          - org.torproject.torbrowser-launcher
          - com.visualstudio.code
          # Communication
          - com.discordapp.Discord
          # Media
          - org.strawberrymusicplayer.strawberry
          - org.audacityteam.Audacity
          - dk.gqrx.gqrx
          - org.lyx.LyX
          # Creativity and science
          - org.kde.krita
          - org.kde.haruna
          - org.stellarium.Stellarium
          - org.gnome.Loupe
          # Productivity
          - io.github.diegopvlk.Dosage
          - org.gnuhealth.mygnuhealth
          - org.gnome.clocks
          - org.gnome.Weather
          - app.gmtp.gMTP
          - as.may.moat
          - io.github.heidefinnischen.cuneo
          # Utilities
          - io.github.kolunmi.Bazaar
          - io.github.jeffshee.Hidamari
          - app.twintaillauncher.ttl
          - org.freedownloadmanager.Manager
          - ai.lmstudio.lm-studio
          - com.github.tchx84.Flatseal
          - com.github.zocker_160.SyncThingy
          # Gaming
          - com.valvesoftware.Steam
          - com.valvesoftware.Steam.CompatibilityTool.Proton
          - com.valvesoftware.Steam.Utility.steamtinkerlaunch
          - com.steamgriddb.SGDBoop
          - com.vysp3r.ProtonPlus
          - com.github.Matoking.protontricks
          - io.github.sharkwouter.Minigalaxy
          - org.openmw.OpenMW
          - com.infochunk.OpenMadoola
          - io.jor.nanosaur
          - io.jor.nanosaur2
          - io.github.hedge_dev.hedgemodmanager
          - com.epicgames.ut99
          - com.epicgames.ut2004
          - com.heroicgameslauncher.hgl
          - net.lutris.Lutris
          # Streaming
          - com.obsproject.Studio
          # Vulkan layers
          - org.freedesktop.Platform.VulkanLayer.MangoHud
          - org.freedesktop.Platform.VulkanLayer.gamescope
          # Runtime
          - org.freedesktop.Platform
      - scope: user

  - type: initramfs
  - type: signing
