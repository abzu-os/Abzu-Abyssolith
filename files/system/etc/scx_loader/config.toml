# /etc/scx_loader/config.toml
# Default scheduler for Abzu Abyssolith
default_sched = "scx_bpfland"
default_mode = "Auto"

[scheds.scx_bpfland]
# Auto mode: let scx_bpfland use its built-in heuristics.
auto_mode = []

# Gaming mode: prioritize interactive tasks and favor performance.
gaming_mode = ["-m", "performance"]

# Low-latency mode: tight time slices for desktop responsiveness.
lowlatency_mode = ["-s", "5000", "-S", "500", "-l", "5000", "-m", "performance"]

# Powersave mode: reduce power draw on laptops and idle servers.
powersave_mode = ["-m", "powersave"]

# Server mode: prioritize per-CPU tasks for throughput (e.g., parallel builds).
server_mode = ["-p"]
