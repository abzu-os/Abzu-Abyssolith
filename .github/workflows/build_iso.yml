name: Build ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install BlueBuild
        run: |
          set -o pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/blue-build/cli/main/install.sh)
          command -v bluebuild
          bluebuild --version

      # Write the GHCR credentials to a fixed, root-readable path so that
      # the build-container-installer container can find them. The default
      # sudo podman login writes to /run/containers/0/auth.json, which is
      # a per-session path that the builder container cannot see.
      - name: Log in to GHCR (explicit auth file)
        run: |
          AUTHFILE="/etc/containers/auth.json"
          sudo mkdir -p "$(dirname "$AUTHFILE")"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login \
            --authfile "$AUTHFILE" ghcr.io \
            -u ${{ github.actor }} --password-stdin
          sudo chmod 644 "$AUTHFILE"
          sudo ls -l "$AUTHFILE"
          echo "REGISTRY_AUTH_FILE=$AUTHFILE" >> "$GITHUB_ENV"

      - name: Generate ISO
        env:
          REGISTRY_AUTH_FILE: ${{ env.REGISTRY_AUTH_FILE }}
        run: |
          sudo --preserve-env=REGISTRY_AUTH_FILE bluebuild generate-iso \
            --iso-name abzu-abyssolith.iso \
            --output-dir ./iso-output \
            image ghcr.io/abzu-os/abzu:latest

      - name: Report ISO size
        run: |
          ISO=$(find ./iso-output -name '*.iso' -type f | head -n1)
          if [ -z "$ISO" ]; then
            echo "No ISO found in ./iso-output" >&2
            ls -R ./iso-output || true
            exit 1
          fi
          ls -lh "$ISO"
          SIZE_BYTES=$(stat -c%s "$ISO")
          echo "ISO_PATH=$ISO" >> "$GITHUB_ENV"
          if [ "$SIZE_BYTES" -gt 2000000000 ]; then
            echo "ISO_OVER_LIMIT=true" >> "$GITHUB_ENV"
          else
            echo "ISO_OVER_LIMIT=false" >> "$GITHUB_ENV"
          fi

      - name: Split ISO for Release (2 GiB per asset)
        if: env.ISO_OVER_LIMIT == 'true'
        run: |
          split -b 1900M --numeric-suffixes=1 --suffix-length=2 \
            "$ISO_PATH" "${ISO_PATH}.part-"
          ls -lh ./iso-output

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ github.run_number }}
          name: Abzu Abyssolith ISO ${{ github.run_number }}
          files: |
            ./iso-output/*.iso
            ./iso-output/*.part-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
