name: Build ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install BlueBuild
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://blue-build.org/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate ISO
        run: |
          bluebuild generate-iso \
            --iso-name abzu-abyssolith.iso \
            --output-dir ./iso-output \
            image ghcr.io/abzu-os/abzu:latest

      - name: Report ISO size
        run: |
          ISO=$(find ./iso-output -name '*.iso' -type f | head -n1)
          if [ -z "$ISO" ]; then
            echo "No ISO found in ./iso-output" >&2
            exit 1
          fi
          ls -lh "$ISO"
          SIZE_BYTES=$(stat -c%s "$ISO")
          echo "ISO_PATH=$ISO" >> "$GITHUB_ENV"
          echo "ISO_SIZE_BYTES=$SIZE_BYTES" >> "$GITHUB_ENV"

      - name: Split ISO for Release (2 GiB per asset)
        if: env.ISO_SIZE_BYTES > 2000000000
        run: |
          split -b 1900M --numeric-suffixes=1 --suffix-length=2 \
            "$ISO_PATH" "${ISO_PATH}.part-"
          ls -lh ./iso-output

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ github.run_number }}
          name: Abzu Abyssolith ISO ${{ github.run_number }}
          files: |
            ./iso-output/*.iso
            ./iso-output/*.part-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
